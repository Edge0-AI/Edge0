name: Scripts test

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/intake.yml'
      - '.github/workflows/reopen.yml'

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/item-check.test.js
