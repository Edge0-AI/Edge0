name: Benchmark
description: Share measurements from your machine, or report a problem with the benchmark tools
title: "[Benchmark] "
labels: ["benchmark"]
body:
  - type: markdown
    value: |
      The title must start with **[Benchmark]**. Keep it, and add the GPU and model after it.

      To share a full report, follow the [community benchmark guide](https://github.com/Niko1221/Strata/blob/main/docs/COMMUNITY_BENCHMARKS.md) and open a results-only pull request. The standard protocol is a [draft](https://github.com/Niko1221/Strata/blob/main/docs/BENCHMARK_PROTOCOL.md); existing tools do not implement it yet. Include poor results and failed requests.
  - type: textarea
    id: what
    attributes:
      label: What did you measure, or what went wrong
      description: Hardware (GPU and VRAM, CPU, RAM, OS), Strata version, model and quantization, the exact command, and the numbers. Paste the report or link the pull request.
    validations:
      required: true
  - type: dropdown
    id: reproduction-status
    attributes:
      label: Reproduction status
      options:
        - Measured locally
        - Unconfirmed (I did not run it)
    validations:
      required: true
