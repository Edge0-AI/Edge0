name: Feature request
description: Suggest something new or an improvement
title: "[Area] "
labels: ["enhancement"]
body:
  - type: markdown
    value: |
      Explain what you want in plain language. For a large feature, a change to a default or a refactor, please agree the scope here first. Read [CONTRIBUTING.md](https://github.com/Niko1221/Strata/blob/main/CONTRIBUTING.md).

      **The title must start with its area:** [Engine], [GUI], [TUI], [Benchmark], [Docs] or [Other]. Choose the same one below.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Start the issue title with the same area in square brackets, for example "[Engine] decode stops after 2 minutes". Pick Other if none fits.
      options:
        - "[Engine]  (speed, kernels, models, the server and API)"
        - "[GUI]  (the desktop app)"
        - "[TUI]  (the Terminal: strata launch, connect, monitor)"
        - "[Benchmark]  (measurements and reports)"
        - "[Docs]  (documentation)"
        - "[Other]  (anything else, including setup and installation)"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you want to do?
      description: Describe the goal rather than the implementation. Say who needs it and why.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead?
      description: The workaround you use now, if there is one.
    validations:
      required: false
  - type: markdown
    value: |
      All of this counts: model and architecture support, the server and API, the app and the Terminal, multi-GPU and layer split, images and vision, MCP servers, setup and installation, and performance.
