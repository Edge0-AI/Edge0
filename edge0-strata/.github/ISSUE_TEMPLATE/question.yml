name: Question
description: Ask how to use Strata, or share a result
title: "[Area] "
labels: ["question"]
body:
  - type: markdown
    value: |
      Not sure how to do something, or want to share numbers from your machine? Ask here. To share a full benchmark, see [CONTRIBUTING.md](https://github.com/Niko1221/Strata/blob/main/CONTRIBUTING.md#share-a-benchmark).

      **The title must start with its area:** [Engine], [GUI], [TUI], [Benchmark], [Docs] or [Other]. Choose the same one below.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Start the issue title with the same area in square brackets, for example "[Engine] decode stops after 2 minutes". Pick Other if none fits.
      options:
        - "[Engine]  (speed, kernels, models, the server and API)"
        - "[GUI]  (the desktop app)"
        - "[TUI]  (the Terminal: strata launch, connect, monitor)"
        - "[Benchmark]  (measurements and reports)"
        - "[Docs]  (documentation)"
        - "[Other]  (anything else, including setup and installation)"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you're trying to do. Include your version, GPU, and OS if it affects the answer.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: What you already did and where you got stuck.
    validations:
      required: false
  - type: textarea
    id: numbers
    attributes:
      label: Results (optional)
      description: Only if you ran a benchmark or measured speed. Model, quant, context, and the tok/s you get.
    validations:
      required: false
