<text x="10" y="210" font-size="12" font-weight="700" fill="#6b7b3a">SSD</text>
<rect x="60" y="200" width="300" height="38" rx="3" fill="#6b7b3a"/><text x="210" y="223" font-size="10" fill="#fff" text-anchor="middle">GGUF shard 1 (37.6-47 GB): read once at start</text>
<rect x="366" y="200" width="326" height="38" rx="3" fill="#95a15f"/><text x="529" y="223" font-size="10" fill="#fff" text-anchor="middle">GGUF shard 2: n-gram table 28.8 GB, memory-mapped</text>
