<svg viewBox="0 0 700 250" width="100%" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="700" height="72" rx="6" fill="#eaf1f9" stroke="#2f6fb3"/>
<text x="10" y="18" font-size="12" font-weight="700" fill="#2f6fb3">GPU VRAM 12 GB &#183; 672 GB/s</text>
<rect x="10" y="26" width="150" height="38" rx="3" fill="#2f6fb3"/><text x="85" y="42" font-size="10" fill="#fff" text-anchor="middle">dense weights ~3.3 GB</text><text x="85" y="56" font-size="9" fill="#fff" text-anchor="middle">mixers &#183; GR &#183; routers &#183; head</text>
<rect x="166" y="26" width="330" height="38" rx="3" fill="#6d9fd4"/><text x="331" y="42" font-size="10" fill="#fff" text-anchor="middle">expert cache: everything left (~6 GB)</text><text x="331" y="56" font-size="9" fill="#fff" text-anchor="middle">~4,500 of 24,576 experts, adaptive</text>
<rect x="502" y="26" width="90" height="38" rx="3" fill="#8fb6e0"/><text x="547" y="42" font-size="10" fill="#fff" text-anchor="middle">MTP layer</text><text x="547" y="56" font-size="9" fill="#fff" text-anchor="middle">0.8 GB</text>
<rect x="598" y="26" width="94" height="38" rx="3" fill="#b3cde9"/><text x="645" y="42" font-size="10" fill="#1b1d21" text-anchor="middle">KV + state</text><text x="645" y="56" font-size="9" fill="#1b1d21" text-anchor="middle">0.3-3 GB</text>
<text x="350" y="88" font-size="10" fill="#5a606b" text-anchor="middle">PCIe 4.0 x16 &#183; ~26 GB/s &#183; experts by DMA (prompt, 20% of misses, cache swaps)</text>
<rect x="0" y="96" width="700" height="72" rx="6" fill="#fbf0e6" stroke="#c7702a"/>
<text x="10" y="114" font-size="12" font-weight="700" fill="#c7702a">System RAM 64 GB DDR5 &#183; ~41-52 GB/s &#183; 6 CPU cores (AVX-512)</text>
<rect x="10" y="122" width="440" height="38" rx="3" fill="#c7702a"/><text x="230" y="138" font-size="10" fill="#fff" text-anchor="middle">pinned expert arena: all 24,576 experts</text><text x="230" y="152" font-size="9" fill="#fff" text-anchor="middle">34 GB (Q2_0) &#183; 35.5 GB (IQ2_XS) &#183; 43 GB (IQ3_XXS); the CPU computes misses in place</text>
<rect x="456" y="122" width="236" height="38" rx="3" fill="#e0a877"/><text x="574" y="138" font-size="10" fill="#fff" text-anchor="middle">OS page cache: hot n-gram rows</text><text x="574" y="152" font-size="9" fill="#fff" text-anchor="middle">+ OS, embedding table, buffers</text>
<text x="350" y="184" font-size="10" fill="#5a606b" text-anchor="middle">NVMe &#183; 16 row reads per token, issued a step ahead</text>
