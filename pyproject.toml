[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge0"
version = "0.1.0"
description = "edge0: streaming MoE inference framework — SSD expert offload, parallel LoRA, prerouter routing prediction. Backend-isolated (MLX now, more platforms coming)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "edge0 contributors" }]
keywords = ["mlx", "moe", "inference", "lora", "ssd-offload", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # NOTE: mlx/mlx-metal pinned to 0.30.6 on purpose.  0.30.4 and older
    # mis-gate the NAX matmul kernels on Apple A18/A18 Pro (silently wrong
    # numbers -> garbled output, issue #8); fixed upstream in 0.30.5
    # (ml-explore/mlx#3083, #3092).  Do not go to mlx>=0.31.2 yet: default
    # streams become thread-local and the pool-thread builds in
    # edge0/streaming/layer.py fail with "no Stream(gpu, N) in current
    # thread".  mlx-lm stays 0.31.0 (newer releases crash in decode).
    "mlx==0.30.6",
    "mlx-metal==0.30.6; platform_system == 'Darwin'",
    "mlx-lm==0.31.0",
    "numpy>=1.24",
    "safetensors>=0.4",
    "tokenizers>=0.15",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
fetch = [
    "huggingface_hub>=0.23",
]

[project.scripts]
edge0 = "edge0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"edge0.checkpoints" = ["LICENSE.ggml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real-weight e2e tests (skip with -m 'not slow')",
]
addopts = "-m 'not slow'"
