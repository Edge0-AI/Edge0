="76" rx="14" fill="#A8DADC" stroke="#45789D" stroke-width="1.5" fill-opacity="0.28" data-node="attention" /><circle cx="840" cy="456" r="17" fill="#FFFFFF" stroke="#45789D" stroke-width="1.5" data-node="add_attention" /><rect x="520" y="500" width="640" height="64" rx="14" fill="#A8DADC" stroke="#45789D" stroke-width="1.5" fill-opacity="0.42" data-node="D" /><rect x="520" y="610" width="240" height="64" rx="14" fill="#FFFFFF" stroke="#45789D" stroke-width="1.5" data-node="router" /><rect x="794" y="590" width="366" height="124" rx="14" fill="#F1FAEE" stroke="#E63946" stroke-width="1.5" data-node="experts" /><rect x="838" y="674" width="26" height="18" rx="4" fill="#A8DADC" stroke="#E63946" stroke-width="1.5" /><rect x="876" y="674" width="26" height="18" rx="4" fill="#FFFFFF" stroke="#A8DADC" stroke-width="1.5" /><rect x="914" y="674" width="26" height="18" rx="4" fill="#A8DADC" stroke="#E63946" stroke-width="1.5" /><rect x="952" y="674" width="26" height="18" rx="4" fill="#FFFFFF" stroke="#A8DADC" stroke-width="1.5" /><rect x="990" y="674" width="26" height="18" rx="4" fill="#FFFFFF" stroke="#A8DADC" stroke-width="1.5" /><rect x="1028" y="674" width="26" height="18" rx="4" fill="#A8DADC" stroke="#E63946" stroke-width="1.5" /><rect x="1066" y="674" width="26" height="18" rx="4" fill="#FFFFFF" stroke="#A8DADC" stroke-width="1.5" /><circle cx="840" cy="766" r="18" fill="#FFFFFF" stroke="#45789D" stroke-width="1.5" data-node="aggregate" /><rect x="520" y="818" width="640" height="64" rx="14" fill="#A8DADC" stroke="#45789D" stroke-width="1.5" fill-opacity="0.42" data-node="U" /><circle cx="840" cy="928" r="17" fill="#FFFFFF" stroke="#45789D" stroke-width="1.5" data-node="add_output" /><circle cx="840" cy="996" r="2.5" fill="#45789D" stroke="#45789D" stroke-width="1.5" data-node="next_layer" /><path d="M 498 590 L 498 714 M 493 590 L 503 590 M 493 714 L 503 714" fill="none" stroke="#E63946" stroke-width="1.5" data-annotation="latent-width-bracket" /><rect x="1219" y="221" width="2" height="707" rx="1" fill="#45789D" stroke="#45789D" stroke-width="1.5" fill-opacity="0.7" data-node="residual_bus" /><rect x="1310" y="120" width="402" height="234" rx="18" fill="#F1FAEE" stroke="#A8DADC" stroke-width="1.5" fill-opacity="0.48" /><rect x="1310" y="386" width="402" height="164" rx="18" fill="#FFFFFF" stroke="#45789D" stroke-width="1.5" stroke-dasharray="6 5" /><rect x="1310" y="582" width="402" height="190" rx="18" fill="#F1FAEE" stroke="#A8DADC" stroke-width="1.5" fill-opacity="0.48" /><rect x="1338" y="860" width="30" height="18" rx="4" fill="#A8DADC" stroke="#45789D" stroke-width="1.5" /><rect x="1338" y="900" width="30" height="18" rx="4" fill="#F1FAEE" stroke="#E63946" stroke-width="1.5" /><rect x="1338" y="940" width="30" height="18" rx="4" fill="#FFFFFF" stroke="#A8DADC" stroke-width="1.5" /><rect x="1338" y="980" width="30" height="18" rx="4" fill="#FFFFFF" stroke="#45789D" stroke-width="1.5" stroke-dasharray="5 4" /><line x1="48" y1="1072" x2="1712" y2="1072" stroke="#A8DADC" stroke-width="1" /></g><g id="labels" fill="#1D3557"><text x="48" y="53" font-size="32" font-weight="700" text-anchor="start" fill="#1D3557" data-source-index="0" xml:space="preserve">Edge0-120B</text><text x="48" y="86" font-size="17" font-weight="400" text-anchor="start" fill="#45789D" data-source-index="1" xml:space="preserve">Latent sparse MoE on Qwen3.8-Flash-Next  ·  48 layers  ·  512 experts  ·  10 routed per token</text><text x="206" y="168" font-size="16" font-weight="400" text-anchor="middle" fill="#45789D" data-source-index="2" xml:space="preserve">input tokens</text><text x="121" y="235" font-size="17" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="3" xml:space="preserve">Embedding</text><text x="291" y="235" font-size="17" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="4" xml:space="preserve">PLE  (fp8)</text><text x="206" y="355" font-size="18" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="5" xml:space="preserve">48 × transformer layer</text><text x="206" y="392" font-size="16" font-weight="400" text-anchor="middle" fill="#1D3557" data-source-index="6" xml:space="preserve">hybrid attention</text><text x="206" y="420" font-size="15" font-weight="400" text-anchor="middle" fill="#45789D" data-source-index="7" xml:space="preserve">full every 4 layers + GDN</text><text x="206" y="448" font-size="15" font-weight="400" text-anchor="middle" fill="#45789D" data-source-index="8" xml:space="preserve">sparse indexer</text><text x="206" y="506" font-size="18" font-weight="700" text-anchor="middle" fill="#E63946" data-source-index="9" xml:space="preserve">latent MoE</text><text x="206" y="533" font-size="14" font-weight="400" text-anchor="middle" fill="#45789D" data-source-index="10" xml:space="preserve">← detail on the right</text><text x="206" y="645" font-size="18" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="11" xml:space="preserve">Final norm</text><text x="206" y="749" font-size="18" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="12" xml:space="preserve">lm_head  ·  248K</text><text x="206" y="849" font-size="16" font-weight="400" text-anchor="middle" fill="#45789D" data-source-index="13" xml:space="preserve">logits</text><text x="438" y="158" font-size="18" font-weight="600" text-anchor="start" fill="#1D3557" data-source-index="14" xml:space="preserve">one layer  ·  latent MoE detail  ·  ℓ = 1280</text><text x="799" y="230" font-size="22" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="15" xml:space="preserve" font-style="italic">h</text><text x="821" y="230" font-size="20" font-weight="400" text-anchor="start" fill="#1D3557" data-source-index="16" xml:space="preserve">∈  ℝ</text><text x="870" y="218" font-size="14" font-weight="400" text-anchor="start" fill="#1D3557" data-source-index="17" xml:space="preserve">T × 2560</text><text x="840" y="300" font-size="20" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="18" xml:space="preserve">+</text><text x="840" y="370" font-size="18" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="19" xml:space="preserve">QSA · GDN hybrid attention</text><text x="840" y="396" font-size="15" font-weight="400" text-anchor="middle" fill="#45789D" data-source-index="20" xml:space="preserve">runs at the full 2560 width</text><text x="840" y="462" font-size="20" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="21" xml:space="preserve">+</text><text x="840" y="539" font-size="18" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="22" xml:space="preserve">D   ·   2560 → ℓ   ·   8 groups (shared)</text><text x="640" y="648" font-size="16" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="23" xml:space="preserve">router  ·  top-10 / 512</text><text x="977" y="625" font-size="19" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="24" xml:space="preserve">512 routed experts</text><text x="977" y="653" font-size="15" font-weight="400" text-anchor="middle" fill="#E63946" data-source-index="25" xml:space="preserve">10 active + 1 shared per token</text><text x="840" y="773" font-size="21" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="26" xml:space="preserve">Σ</text><text x="840" y="857" font-size="18" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="27" xml:space="preserve">U   ·   ℓ → 2560   (shared)</text><text x="840" y="934" font-size="20" font-weight="600" text-anchor="middle" fill="#1D3557" data-source-index="28" xml:space="preserve">+</text><text x="840" y="1022" font-size="16" font-weight="400" text-anchor="middle" fill="#45789D" data-source-index="29" xml:space="preserve">→ next layer</text><text x="480" y="658" font-size="19" font-weight="700" text-anchor="middle" fill="#E63946" data-source-index="30" xml:space="preserve" font-style="italic">ℓ</text><text x="1338" y="157" font-size="21" font-weight="700" text-anchor="start" fill="#1D3557" data-source-index="31" xml:space="preserve">specs</text><text x="1338" y="191" font-size="16" font-weight="400" text-anchor="start" fill="#1D3557" data-source-index="32" xml:space="preserve">total  120B</text><text x="1338" y="222" font-size="16" font-weight="600" text-anchor="start" fill="#E63946" data-source-index="33" xml:space="preserve">active / token  8.64B</text><text x="1338" y="253" font-size="16" font-weight="400" text-anchor="start" fill="#1D3557" data-source-index="34" xml:space="preserve">48 × 512 experts  60.4B</text><text x="1338" y="284" font-size="16" font-weight="400" text-anchor="start" fill="#1D3557" data-source-index="35" xml:space="preserve">PLE  51.2B  ·  MTP  1.26B</text><text x="1338" y="315" font-size="16" font-weight="400" text-anchor="start" fill="#1D3557" data-source-index="36" xml:space="preserve">context  256K</text><text x="1338" y="423" font-size="18" font-weight="600" text-anchor="start" fill="#1D3557" data-source-index="37" xml:space="preserve">MTP draft head  1.26B</text><text x="1338" y="454" font-size="16" font-weight="400" text-anchor="start" fill="#45789D" data-source-index="38" xml:space="preserve">extra head, 512 experts,</text><text x="1338" y="482" font-size="16" font-weight="400" text-anchor="start" fill="#45789D" data-source-index="39" xml:space="preserve">trained with the model and</text><text x="1338" y="510" font-size="16" font-weight="400" text-anchor="start" fill="#45789D" data-source-index="40" xml:space="preserve">used for speculative decode</text><text x="1338" y="619" font-size="19" font-weight="600" text-anchor="start" fill="#1D3557" data-source-index="41" xml:space="preserve">one expert</text><text x="1338" y="651" font-size="16" font-weight="400" text-anchor="start" fill="#45789D" data-source-index="42" xml:space="preserve">ℓ → 640 → ℓ,  SwiGLU</text><text x="1338" y="679" font-size="16" font-weight="400" text-anchor="start" fill="#1D3557" data-source-index="43" xml:space="preserve">1,164,800 B per record</text><text x="1338" y="707" font-size="16" font-weight="400" text-anchor="start" fill="#45789D" data-source-index="44" xml:space="preserve">pinned, swapped or</text><text x="1338" y="735" font-size="16" font-weight="400" text-anchor="start" fill="#45789D" data-source-index="45" xml:space="preserve">streamed onto the GPU</text><text x="1338" y="840" font-size="21" font-weight="700" text-anchor="start" fill="#1D3557" data-source-index="46" xml:space="preserve">legend</text><text x="1384" y="875" font-size="16" font-weight="400" text-anchor="start" fill="#1D3557" data-source-index="47" xml:space="preserve">full 2560 width</text><text x="1384" y="915" font-size="16" font-weight="400" text-anchor="start" fill="#1D3557" data-source-index="48" xml:space="preserve">latent width ℓ</text><text x="1384" y="955" font-size="16" font-weight="400" text-anchor="start" fill="#1D3557" data-source-index="49" xml:space="preserve">idle expert</text><text x="1384" y="995" font-size="16" font-weight="400" text-anchor="start" fill="#1D3557" data-source-index="50" xml:space="preserve">optional / side path</text><text x="48" y="1101" font-size="16" font-weight="400" text-anchor="start" fill="#45789D" data-source-index="51" xml:space="preserve"><tspan x="48" dy="0">Attention, embedding and the shared D/U projections keep the full 2560 width; the 512 routed experts read and write ℓ only, </tspan><tspan x="48" dy="24">which is what makes one expert a fixed-size record.</tspan></text></g></svg>