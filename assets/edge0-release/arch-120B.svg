<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1160" viewBox="0 0 1760 1160" role="img" aria-labelledby="architecture-title architecture-description" font-family="Arial, Helvetica, sans-serif"><title id="architecture-title">Edge0-120B latent sparse MoE architecture</title><desc id="architecture-description">The full model stack appears on the left, one transformer layer is expanded in the center, and parameter specifications, MTP, expert records and the legend appear on the right. active parameters per token are 8.64B.</desc><rect width="1760" height="1160" fill="#FFFFFF" data-background="canvas" /><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#45789D" /></marker></defs><g id="connections"><path id="edge-embedding-to-merge" data-edge="embedding-to-merge" data-from="embedding" data-to="merge" data-role="flow" d="M 121 256 L 121 288 L 206 288" fill="none" stroke="#45789D" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" /><path id="edge-ple-to-merge" data-edge="ple-to-merge" data-from="ple" data-to="merge" data-role="flow" d="M 291 256 L 291 288 L 206 288" fill="none" stroke="#45789D" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" /><path id="edge-merge-to-layer" data-edge="merge-to-layer" data-from="merge" data-to="layer" data-role="flow" d="M 206 291.5 L 206 320" fill="none" stroke="#45789D" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#flow-arrow)" /><path id="edge-layer-to-final_norm" data-edge="layer-to-final_norm" data-from="layer" data-to="final_norm" data-role="flow" d="M 206 570 L 206 610" fill="none" stroke="#45789D" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#flow-arrow)" /><path id="edge-final_norm-to-lm_head" data-edge="final_norm-to-lm_head" data-from="final_norm" data-to="lm_head" data-role="flow" d="M 206 666 L 206 714" fill="