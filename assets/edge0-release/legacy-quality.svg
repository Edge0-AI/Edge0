<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="402" viewBox="0 0 1040 402" role="img" aria-labelledby="legacy-title legacy-description"><title id="legacy-title">Earlier Edge0 models · Quality</title><desc id="legacy-description">Source Quality compares int4 Edge0 pipelines against fp16 baselines with OpenCompass; Average is retained as reported. Benchmark: AIME 2026, edge0-35b (int4): 86.6, Qwen3.6-35B-A3B (fp16): 92.7, edge0-8b (int4): 63.3, Ling 3.0 tiny (fp16): 73.3; Benchmark: HumanEval, edge0-35b (int4): 90.9, Qwen3.6-35B-A3B (fp16): 95.1, edge0-8b (int4): 91.5, Ling 3.0 tiny (fp16): 92.7; Benchmark: GPQA-Diamond, edge0-35b (int4): 79.8, Qwen3.6-35B-A3B (fp16): 81.8, edge0-8b (int4): 70.7, Ling 3.0 tiny (fp16): 71.2; Benchmark: MMLU-Pro, edge0-35b (int4): 81.0, Qwen3.6-35B-A3B (fp16): 84.6, edge0-8b (int4): 70.1, Ling 3.0 tiny (fp16): 65.8; Benchmark: IFBench, edge0-35b (int4): 57.9, Qwen3.6-35B-A3B (fp16): 61.7, edge0-8b (int4): 53.9, Ling 3.0 tiny (fp16): 60.6; Benchmark: Average, edge0-35b (int4): 79.2, Qwen3.6-35B-A3B (fp16): 83.2, edge0-8b (int4): 69.9, Ling 3.0 tiny (fp16): 72.7</desc><rect width="1040" height="402" fill="#FFFFFF" /><defs><clipPath id="legacy-corners"><rect x="32" y="32" width="976" height="338" rx="8" /></clipPath></defs><g clip-path="url(#legacy-corners)"><rect x="32" y="32" width="976" height="50" fill="#E63946" /><rect x="32" y="322" width="976" height="48" fill="#D8EEEF" data-highlight-row="5" /></g><g font-family="-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,&quot;Helvetica Neue&quot;,Inter,Arial,sans-serif" dominant-baseline="central"><text x="48" text-anchor="start" font-size="11" font-weight="700" fill="#F1FAEE" data-row="-1" data-column="0"><tspan x="48" y="57.0">Benchmark</tspan></text><text x="406" text-anchor="end" font-size="11" font-weight="700" fill="#F1FAEE" data-row="-1" data-column="1"><tspan x="406" y="57.0">edge0-35b (int4)</tspan></text><text x="636" text-anchor="end" font-size="11" font-wei