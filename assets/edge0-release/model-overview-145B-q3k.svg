<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="overview-title overview-description"><title id="overview-title">Edge0-145B · Q3_K model overview</title><desc id="overview-description">Edge0-145B latent mixture of experts. 10.12 billion active parameters per token. Q3_K on RTX 5090 D 24 GB: 121.2 tok/s agent decode, 3554.9 tok/s 16K prefill. Model-level quality scores and both weight formats are shown; quality is not a separate evaluation of each format.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32.5 .5 H .5 V 32.5" fill="none" stroke="#0F172A" stroke-opacity="0.055" stroke-width="1" /></pattern><pattern id="fine-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M 8.5 .5 H .5 V 8.5" fill="none" stroke="#0F172A" stroke-opacity="0.02" stroke-width="1" /></pattern><radialGradient id="corner-glow" gradientUnits="userSpaceOnUse" cx="1270" cy="80" r="820.0609733428363"><stop offset="0%" stop-color="#E63946" stop-opacity="0.15" /><stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" /></radialGradient></defs><rect width="1600" height="900" fill="#F8FCF7" /><rect width="1600" height="900" fill="url(#grid)" /><rect width="1600" height="900" fill="url(#fine-grid)" /><rect x="620" y="-420" width="1300" height="1000" fill="url(#corner-glow)" /><rect x="26.5" y="26.5" width="1547" height="847" fill="none" stroke="#0F172A" stroke-opacity="0.12" /><path d="M 27 52 V 27 H 52 M 1548 873 H 1573 V 848" fill="none" stroke="#E63946" stroke-width="2" /><g font-family="'SF Pro Display','Helvetica Neue',Inter,Arial,sans-serif" fill="#0B1220"><rect x="79" y="64.25" width="36" height="36" fill="#FFFFFF" stroke="#E63946" stroke-width="2" /><rect x="88" y="73.25" width="18" height="18" fill="#E63946" fill-opacity="0.9" /><text x="130" y="62" font-size="19" font-weight="800" fill="#0B1220" text-anchor="start" dominant-baseline="text-before-edge" data-source