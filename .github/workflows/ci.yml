name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-macos:
    name: Unit tests (macOS + MLX)
    # MLX needs Apple Silicon, so this has to be an arm64 runner:
    # macos-15 and later are arm64, macos-13 is Intel.  macos-14 is
    # retired, and its jobs are cancelled before a runner is assigned.
    runs-on: macos-15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -m 'not slow'

  hygiene:
    name: Repo hygiene (pure Python, no MLX)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Hygiene checks
        run: pytest tests/test_repo_hygiene.py
