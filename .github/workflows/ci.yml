name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge0-infer:
    name: edge0-infer ${{ matrix.level }} (macOS, cpu preset)
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        level: [L0/L1, L2]
    defaults:
      run:
        working-directory: edge0-infer
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja uv ccache
      - name: Python environment for the tests
        run: uv sync --project tools/assets
      - name: Environment
        run: |
          echo "MOE_SOURCE_35B=$HOME/moe-data/source" >> "$GITHUB_ENV"
          echo "MOE_TINY=$HOME/moe-data/tiny" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-cpu-${{ github.sha }}
          restore-keys: ccache-cpu-
      # L2 runs on the tiny fixtures: a random-weight model with the 35B structure, generated
      # from three small text files of the 35B source (tools/assets/README.md#tiny-fixtures).
      - name: Restore tiny fixtures
        id: fixtures
        if: matrix.level == 'L2'
        uses: actions/cache@v4
        with:
          path: ~/moe-data
          key: tiny-fixtures-${{ hashFiles('edge0-infer/tools/assets/**/*.py', 'edge0-infer/tools/assets/**/*.json', 'edge0-infer/tools/assets/uv.lock') }}
      - name: Generate tiny fixtures
        if: matrix.level == 'L2' && steps.fixtures.outputs.cache-hit != 'true'
        run: |
          rm -rf "$HOME/moe-data"
          mkdir -p "$MOE_TINY"
          assets_py() { uv run --project tools/assets --offline --no-sync python -I "$@"; }
          assets_py tools/assets/edge0_35b/fetch_source.py download --out "$MOE_SOURCE_35B" --files tokenizer.json chat_template.jinja generation_config.json
          assets_py tools/assets/edge0_35b/make_tiny.py --source "$MOE_SOURCE_35B" --out "$MOE_TINY/tiny-a"
          assets_py tools/assets/edge0_35b/make_tiny.py --source "$MOE_SOURCE_35B" --out "$MOE_TINY/tiny-b"
      - name: Configure
        run: cmake --preset cpu
      - name: Build
        run: cmake --build --preset cpu
      - name: Test (L0, L1)
        if: matrix.level == 'L0/L1'
        run: ctest --preset cpu --no-tests=error --output-on-failure -L "L0|L1"
      # The hosted runner has three cores and every test already uses all of them, so the L2
      # tests run one at a time. To stay within about ten minutes, CI skips the slow L2 tests
      # whose behavior other tests mostly cover, or which check development tools; run the
      # full L2 level locally (docs/testing.md).
      - name: Test (L2)
        if: matrix.level == 'L2'
        run: >-
          ctest --preset cpu --no-tests=error --output-on-failure -j 1 --timeout 600 -L L2 -LE device
          -E '^moe_test_(generate_answers|cancel|chat_strata|forward_split|edge0_35b_forward|thinking_tools|generate|mixed_stages|trace_counts|text_cli|answers_export_determinism|bench_cli|chat_cli|generate_cli|sampling|threads_cli)$'
