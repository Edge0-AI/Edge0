name: 🐞 Bug report
description: Something is broken, crashes, or produces wrong/garbled output.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the environment fields — most issues are
        pinned down by the platform, backend, chip, engine build, and the routing / LoRA options.

        **Before filing:** search [existing issues](https://github.com/Edge0-AI/Edge0/issues?q=is%3Aissue)
        and the [known limitations](https://github.com/Edge0-AI/Edge0/blob/main/edge0-infer/docs/limitations.md).

  - type: dropdown
    id: platform
    attributes:
      label: Platform / backend
      description: Where does the engine run? For split runs (e.g. Vulkan prefill, CPU decode), pick the decode backend and say so below.
      options:
        - macOS (Metal)
        - macOS (CPU)
        - iOS (Metal)
        - Android (CPU)
        - Windows (CPU)
        - Windows (Vulkan)
        - Linux (CPU)
        - Linux (NVIDIA GPU, edge0-strata)
        - Windows (NVIDIA GPU, edge0-strata)
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Model tier
      options:
        - edge0-35b
        - edge0-145b
        - edge0-120b
        - other / custom checkpoint
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware / chip
      description: e.g. "Mac mini M4 Pro", "MacBook Air M1", "iPhone 16 Pro (A18 Pro)", "RTX 4090", "Pixel 10 Pro".
      placeholder: Apple M1 Pro
    validations:
      required: true

  - type: input
    id: ram
    attributes:
      label: RAM / unified memory
      description: Total memory of the device. Many "slow" / OOM reports come from low-memory machines.
      placeholder: 16 GB
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: macOS 15.1 / Windows 11 23H2 / Ubuntu 24.04 / Android 15 / iOS 18.1
    validations:
      required: true

  - type: input
    id: engine_version
    attributes:
      label: Engine build
      description: "The engine.version and engine.source_commit lines printed by: edge0-infer info"
      placeholder: "engine.version: 0.2.0, engine.source_commit: ..."
    validations:
      required: false

  - type: dropdown
    id: install_method
    attributes:
      label: How are you running it?
      options:
        - edge0-infer CLI (run / chat / bench)
        - edge0-infer serve (local OpenAI- and Anthropic-compatible server)
        - Native C++ API in my own application
        - Chat app example (desktop / Android / iOS)
        - Other (describe below)
    validations:
      required: false

  - type: dropdown
    id: adapters
    attributes:
      label: Routing / LoRA options
      description: Does the bug still happen with the prerouter disabled (`--model-option routing=actual`)? This isolates a whole class of bugs.
      options:
        - Default (routing=predicted, lora=on)
        - "routing=actual"
        - "routing=actual, lora=off (bare base model)"
    validations:
      required: false

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: After the 3rd request in the same process, every output collapses to "!!!!".
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands / code. Include the prompt if output is wrong.
      placeholder: |
        1. edge0-infer serve --model "$MODEL_DIR" --device metal
        2. curl -X POST http://127.0.0.1:8000/v1/chat/completions -d '...'
        3. Repeat 3 times
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace / output
      description: Paste any error output or the garbled text. This will be rendered as code, no need for backticks.
      render: shell
    validations:
      required: false
