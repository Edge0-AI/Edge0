name: 🐢 Performance report
description: Decode/prefill speed, time-to-first-token, or memory usage differs from the documented benchmarks.
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for "slower than the README numbers" or "high memory / OOM" reports
        (e.g. #17, #110). The reference figures and the devices they were measured on are in
        [Benchmarking](https://github.com/Edge0-AI/Edge0/blob/main/edge0-infer/docs/benchmarking.md#reference-figures).
        Throughput depends on memory and storage speed — please include your total RAM and storage type.

  - type: dropdown
    id: tier
    attributes:
      label: Model tier
      options:
        - edge0-35b
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware / chip
      placeholder: Apple M1 Pro
    validations:
      required: true

  - type: input
    id: ram
    attributes:
      label: Total RAM / unified memory
      placeholder: 16 GB
    validations:
      required: true

  - type: input
    id: disk
    attributes:
      label: Storage type
      description: Internal SSD vs external/USB matters a lot for streaming expert reads.
      placeholder: Internal NVMe SSD
    validations:
      required: false

  - type: input
    id: decode_observed
    attributes:
      label: Observed decode speed (tok/s)
      placeholder: "0.6 tok/s (doc says ~15)"
    validations:
      required: false

  - type: input
    id: ttft
    attributes:
      label: Observed time-to-first-token
      placeholder: 11 s
    validations:
      required: false

  - type: input
    id: memory
    attributes:
      label: Observed peak memory
      description: Name the metric (macOS / iOS phys_footprint, Android RSS, Windows working set); they are not comparable.
      placeholder: 3.4 GiB (phys_footprint)
    validations:
      required: false

  - type: textarea
    id: flags
    attributes:
      label: Flags / settings tried
      description: e.g. --device, --prefill-device, --threads, --model-option expert_slots=8, routing, context length.
      placeholder: Tried --model-option expert_slots=8, no change.
    validations:
      required: false

  - type: textarea
    id: command
    attributes:
      label: Exact command used to measure
      description: Ideally the `edge0-infer bench` summary so numbers are comparable.
      render: shell
    validations:
      required: true
